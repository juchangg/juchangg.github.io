<style>

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.ladder{width:100%;border-collapse:collapse;font-size:14px}
.ladder th,.ladder td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ladder th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.ladder td.num{font-variant-numeric:tabular-nums;font-family:var(--f-display)}

.scroll{overflow-x:auto}
.overlay{position:fixed;inset:0;background:rgba(8,12,10,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:720px;padding:22px;position:relative}
.modal .x{position:absolute;right:12px;top:12px}

.post-body{white-space:pre-wrap;margin:0 0 6px}
.cmts{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:14px}
.cmt{display:flex;gap:10px}

.cmt .bubble p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{margin-left:40px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;width:min(320px,100%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
.admin-box{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface-2)}
.admin-box summary{cursor:pointer;font-weight:500;color:var(--accent)}
.admin-box[open] summary{margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){.top .name,.crumb{display:none}.lb li{grid-template-columns:24px 30px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   設定：填入 Supabase 專案的 URL 與 anon key 就會切換成正式資料庫。
   兩個都空白 = 示範模式（資料只存在這台瀏覽器）。
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://nlxciibsriyjldisuefr.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_M-a1saZMHa06aZQiQ_e0LA_5y6MXHdN',
  APP_NAME: '聚場'
};

/* ---------- 共用工具 ---------- */
const LEVEL_PTS = [0,5,20,65,155,515,2015,8015,33015];
const DEFAULT_LEVEL_NAMES = ['新手','學徒','行動者','實踐者','推手','導師','領航者','大師','傳奇'];
const levelFor = p => { let l = 1; for (let i = 0; i < 9; i++) if (p >= LEVEL_PTS[i]) l = i + 1; return l; };
const levelProgress = p => {
  const l = levelFor(p);
  if (l >= 9) return { level: 9, need: 0, pct: 100 };
  const lo = LEVEL_PTS[l-1], hi = LEVEL_PTS[l];
  return { level: l, need: hi - p, pct: Math.round((p - lo) / (hi - lo) * 100) };
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const nowIso = () => new Date().toISOString();
const byTime = (a, b) => a.created_at.localeCompare(b.created_at);
const rtf = new Intl.RelativeTimeFormat('zh-TW', { numeric: 'auto' });
function ago(iso) {
  const s = (new Date(iso) - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return '剛剛';
  if (a < 3600) return rtf.format(Math.round(s/60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s/3600), 'hour');
  if (a < 86400*30) return rtf.format(Math.round(s/86400), 'day');
  return new Date(iso).toLocaleDateString('zh-TW');
}
const AV_COLORS = ['#0D6A5B','#7A4FA0','#B5532E','#2F6FA8','#8A6A12','#A23B5E','#3F7D3A','#5A5F9E'];
function avatar(user, points, small) {
  const name = user?.name || '?';
  let h = 0; for (const ch of String(user?.id || name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const lv = points == null ? '' : `<span class="lv" title="等級 ${levelFor(points)}">${levelFor(points)}</span>`;
  return `<span class="av${small ? ' sm' : ''}" style="background:${AV_COLORS[h % AV_COLORS.length]}" aria-hidden="true">${esc(name.trim().charAt(0) || '?')}${lv}</span>`;
}
const heart = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 18.5 21H7V10l4.4-7.4A1.8 1.8 0 0 1 15 4.4z"/></svg>`;
const COVER_BG = ['linear-gradient(135deg,#0D6A5B,#2C8F7C)','linear-gradient(135deg,#7A4FA0,#A77CC9)','linear-gradient(135deg,#B5532E,#D98A55)','linear-gradient(135deg,#2F6FA8,#5C9AD0)','linear-gradient(135deg,#8A6A12,#C29A35)'];
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}

/* =====================================================================
   資料層 A：示範模式（localStorage）
   ===================================================================== */
function makeDemoApi() {
  const KEY = 'juchang-demo-v1';
  let db = load();
  function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} return seed(); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  const user = id => db.users.find(u => u.id === id) || { id, name: '已離開的成員' };
  const author = id => { const u = user(id); return { id: u.id, name: u.name }; };
  const mem = (cid, u = db.session) => db.memberships.find(m => m.community_id === cid && m.user_id === u);
  const isMember = cid => mem(cid)?.status === 'active';
  const isAdmin = cid => isMember(cid) && mem(cid).role !== 'member';
  const countLikes = (t, id) => db.likes.filter(l => l.target_type === t && l.target_id === id).length;
  const liked = (t, id) => db.likes.some(l => l.target_type === t && l.target_id === id && l.user_id === db.session);
  const need = cond => { if (!cond) throw new Error('你沒有權限做這件事'); };

  return {
    mode: 'demo',
    async getUser() { const u = db.users.find(x => x.id === db.session); return u ? { id: u.id, name: u.name, email: u.email } : null; },
    async signIn(email) {
      const u = db.users.find(x => x.email === email.trim().toLowerCase());
      if (!u) throw new Error('示範模式找不到這個 Email，請改用「註冊」，或用 demo@juchang.app');
      db.session = u.id; save();
    },
    async signUp(email, pw, name) {
      email = email.trim().toLowerCase();
      if (db.users.some(x => x.email === email)) throw new Error('這個 Email 已經註冊過，請直接登入');
      const u = { id: newId(), name: name || email.split('@')[0], email }; db.users.push(u); db.session = u.id; save();
    },
    async signOut() { db.session = null; save(); },
    async reset() { db = seed(); save(); },
    async listCommunities() {
      return db.communities.map(c => ({ ...c, member_count: db.memberships.filter(m => m.community_id === c.id && m.status === 'active').length }));
    },
    async myMemberships() { return db.memberships.filter(m => m.user_id === db.session); },
    async createCommunity(d) {
      if (db.communities.some(c => c.slug === d.slug)) throw new Error('這個網址代稱已經有人用了，換一個試試');
      const c = { id: newId(), ...d, owner_id: db.session, level_names: [...DEFAULT_LEVEL_NAMES], price_monthly: 0, created_at: nowIso() };
      db.communities.push(c);
      db.memberships.push({ community_id: c.id, user_id: db.session, role: 'owner', status: 'active', points: 0, joined_at: nowIso() });
      ['公告','一般討論','成果分享','提問'].forEach((n, i) => db.categories.push({ id: newId(), community_id: c.id, name: n, sort: i, admin_only: i === 0 }));
      save(); return c;
    },
    async join(cid) {
      if (mem(cid)) return mem(cid).status;
      const c = db.communities.find(x => x.id === cid); const status = c.is_private ? 'pending' : 'active';
      db.memberships.push({ community_id: cid, user_id: db.session, role: 'member', status, points: 0, joined_at: nowIso() });
      save(); return status;
    },
    async leave(cid) { need(mem(cid)?.role !== 'owner'); db.memberships = db.memberships.filter(m => !(m.community_id === cid && m.user_id === db.session)); save(); },
    async listCategories(cid) { return db.categories.filter(c => c.community_id === cid).sort((a, b) => a.sort - b.sort); },
    async listPosts(cid) {
      if (!isMember(cid)) return [];
      return db.posts.filter(p => p.community_id === cid).map(p => ({ ...p, author: author(p.author_id), like_count: countLikes('post', p.id), liked: liked('post', p.id), comment_count: db.comments.filter(c => c.post_id === p.id).length }))
        .sort((a, b) => (b.pinned - a.pinned) || b.created_at.localeCompare(a.created_at));
    },
    async createPost(d) {
      need(isMember(d.community_id));
      const cat = db.categories.find(c => c.id === d.category_id);
      if (cat?.admin_only && !isAdmin(d.community_id)) throw new Error(`只有管理員可以在「${cat.name}」發文`);
      db.posts.push({ id: newId(), ...d, author_id: db.session, pinned: false, created_at: nowIso() }); save();

    async deletePost(id) {
      const p = db.posts.find(x => x.id === id); need(p.author_id === db.session || isAdmin(p.community_id));
      const cids = db.comments.filter(c => c.post_id === id).map(c => c.id);
      db.posts = db.posts.filter(x => x.id !== id); db.comments = db.comments.filter(c => c.post_id !== id);
      db.likes = db.likes.filter(l => !(l.target_type === 'post' && l.target_id === id) && !(l.target_type === 'comment' && cids.includes(l.target_id)));
      save();
    },
    async listComments(pid) {
      return db.comments.filter(c => c.post_id === pid).sort(byTime).map(c => ({ ...c, author: author(c.author_id), like_count: countLikes('comment', c.id), liked: liked('comment', c.id) }));

    async createComment(d) { need(isMember(d.community_id)); db.comments.push({ id: newId(), ...d, author_id: db.session, created_at: nowIso() }); save(); },
    async toggleLike(type, id) {
      const t = (type === 'post' ? db.posts : db.comments).find(x => x.id === id);
      if (!t) throw new Error('找不到這則內容');
      if (t.author_id === db.session) throw new Error('不能幫自己按讚');
      need(isMember(t.community_id));
      const i = db.likes.findIndex(l => l.target_type === type && l.target_id === id && l.user_id === db.session);
      const rm = mem(t.community_id, t.author_id);
      if (i >= 0) {
        db.likes.splice(i, 1);
        if (rm) rm.points = Math.max(0, rm.points - 1);
        db.point_events.push({ community_id: t.community_id, user_id: t.author_id, delta: -1, created_at: nowIso() });
      } else {
        db.likes.push({ user_id: db.session, target_type: type, target_id: id, community_id: t.community_id, recipient_id: t.author_id, created_at: nowIso() });
        if (rm) rm.points += 1;
        db.point_events.push({ community_id: t.community_id, user_id: t.author_id, delta: 1, created_at: nowIso() });
      }
      save();
    },

      return db.memberships.filter(m => m.community_id === cid && m.status === 'active').map(m => ({
        user_id: m.user_id, name: user(m.user_id).name, total_points: m.points,
        points: days ? db.point_events.filter(e => e.community_id === cid && e.user_id === m.user_id && new Date(e.created_at) >= since).reduce((s, e) => s + e.delta, 0) : m.points
      })).sort((a, b) => b.points - a.points).slice(0, 50);
    },
    async listMembers(cid) {
      if (!isMember(cid)) return [];

   資料層 B：Supabase（填好 CONFIG 後啟用，對應 schema.sql）
   ===================================================================== */
function makeSupabaseApi() {
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  let me = null;
  const translate = m => {
    if (/communities_slug_key|duplicate key.*slug/.test(m)) return '這個網址代稱已經有人用了，換一個試試';
    if (/communities_slug_check/.test(m)) return '網址代稱只能用小寫英文、數字和「-」，長度 3–41 字';
    if (/Invalid login credentials/.test(m)) return 'Email 或密碼不正確';
    if (/row-level security/.test(m)) return '你沒有權限做這件事';
    return m;
  };
  const ok = ({ data, error }) => { if (error) throw new Error(translate(error.message)); return data; };
  const prof = p => p ? { id: p.id, name: p.display_name } : { id: null, name: '已離開的成員' };
  async function likeInfo(type, ids) {
    const m = {}; if (!ids.length) return m;
    ok(await sb.from('likes').select('target_id,user_id').eq('target_type', type).in('target_id', ids))
      .forEach(r => { m[r.target_id] ??= { n: 0, mine: false }; m[r.target_id].n++; if (r.user_id === me.id) m[r.target_id].mine = true; });
    return m;
  }
  return {
    mode: 'supabase',
    async getUser() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { me = null; return null; }
      const p = ok(await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
      me = { id: session.user.id, name: p?.display_name || session.user.email, email: session.user.email };
      return me;
    },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, name) {
      const d = ok(await sb.auth.signUp({ email, password, options: { data: { display_name: name } } }));
      if (!d.session) throw new Error('註冊成功！請到信箱點驗證信，再回來登入');
    },
    async signOut() { await sb.auth.signOut(); me = null; },
    async listCommunities() {
      const cs = ok(await sb.from('communities').select('*').order('created_at'));
      const st = Object.fromEntries(ok(await sb.from('community_stats').select('*')).map(s => [s.community_id, s.member_count]));
      return cs.map(c => ({ ...c, member_count: st[c.id] || 0 }));
    },
    async myMemberships() { return ok(await sb.from('memberships').select('*').eq('user_id', me.id)); },
    async createCommunity(d) { return ok(await sb.from('communities').insert({ ...d, owner_id: me.id }).select().single()); },
    async join(cid) { return ok(await sb.rpc('join_community', { cid })); },
    async leave(cid) { ok(await sb.from('memberships').delete().eq('community_id', cid).eq('user_id', me.id)); },
    async listCategories(cid) { return ok(await sb.from('categories').select('*').eq('community_id', cid).order('sort')); },
    async listPosts(cid) {
      const ps = ok(await sb.from('posts').select('*, author:profiles(id,display_name)').eq('community_id', cid)
        .order('pinned', { ascending: false }).order('created_at', { ascending: false }).limit(100));
      const ids = ps.map(p => p.id), li = await likeInfo('post', ids), cc = {};
      if (ids.length) ok(await sb.from('comments').select('post_id').in('post_id', ids)).forEach(c => cc[c.post_id] = (cc[c.post_id] || 0) + 1);
      return ps.map(p => ({ ...p, author: prof(p.author), like_count: li[p.id]?.n || 0, liked: !!li[p.id]?.mine, comment_count: cc[p.id] || 0 }));
    },
    async createPost(d) { ok(await sb.from('posts').insert({ ...d, author_id: me.id })); },
    async togglePin(id) { const p = ok(await sb.from('posts').select('pinned').eq('id', id).single()); ok(await sb.from('posts').update({ pinned: !p.pinned }).eq('id', id)); },
    async deletePost(id) { ok(await sb.from('posts').delete().eq('id', id)); },
    async listComments(pid) {
      const cs = ok(await sb.from('comments').select('*, author:profiles(id,display_name)').eq('post_id', pid).order('created_at'));
      const li = await likeInfo('comment', cs.map(c => c.id));
      return cs.map(c => ({ ...c, author: prof(c.author), like_count: li[c.id]?.n || 0, liked: !!li[c.id]?.mine }));
    },
    async createComment(d) { ok(await sb.from('comments').insert({ ...d, author_id: me.id })); },
    async toggleLike(type, id) {
      const ex = ok(await sb.from('likes').select('user_id').eq('user_id', me.id).eq('target_type', type).eq('target_id', id));
      if (ex.length) ok(await sb.from('likes').delete().eq('user_id', me.id).eq('target_type', type).eq('target_id', id));
      else ok(await sb.from('likes').insert({ user_id: me.id, target_type: type, target_id: id }));
    },
    async leaderboard(cid, days) {
      return ok(await sb.rpc('leaderboard', { cid, days: days || null })).map(r => ({ user_id: r.user_id, name: r.display_name, points: Number(r.points), total_points: r.total_points }));
    },
    async listMembers(cid) {
      return ok(await sb.from('memberships').select('*, profile:profiles(id,display_name)').eq('community_id', cid).order('points', { ascending: false }))
        .map(m => ({ ...m, name: m.profile?.display_name || '成員' }));
    },
    async setMemberStatus(cid, uid, status) {
      const q = sb.from('memberships');
      ok(await (status === 'removed' ? q.delete() : q.update({ status })).eq('community_id', cid).eq('user_id', uid));
    },
    async listCourses(cid) {
      const cs = ok(await sb.from('courses').select('*, modules(*, lessons(id,title,sort))').eq('community_id', cid).order('sort'));
      return cs.map(c => ({ ...c, modules: (c.modules || []).sort((a, b) => a.sort - b.sort).map(m => ({ ...m, lessons: (m.lessons || []).sort((a, b) => a.sort - b.sort) })) }));
    },
    async getLesson(id) { return ok(await sb.from('lessons').select('*').eq('id', id).maybeSingle()); },
    async listProgress() { return ok(await sb.from('lesson_progress').select('lesson_id').eq('user_id', me.id)).map(r => r.lesson_id); },
    async toggleComplete(lid) {
      const ex = ok(await sb.from('lesson_progress').select('lesson_id').eq('user_id', me.id).eq('lesson_id', lid));
      if (ex.length) ok(await sb.from('lesson_progress').delete().eq('user_id', me.id).eq('lesson_id', lid));
      else ok(await sb.from('lesson_progress').insert({ user_id: me.id, lesson_id: lid }));
    },
    async createCourse(d) { return ok(await sb.from('courses').insert(d).select().single()); },
    async createModule(d) { ok(await sb.from('modules').insert(d)); },
    async createLesson(d) { return ok(await sb.from('lessons').insert(d).select().single()); },
    async listEvents(cid) {
      return ok(await sb.from('events').select('*, rsvps(user_id)').eq('community_id', cid).order('starts_at'))
        .map(e => ({ ...e, going_count: e.rsvps.length, going: e.rsvps.some(r => r.user_id === me.id) }));
    },
    async createEvent(d) { ok(await sb.from('events').insert({ ...d, created_by: me.id })); },
    async toggleRsvp(eid) {
      const ex = ok(await sb.from('rsvps').select('user_id').eq('event_id', eid).eq('user_id', me.id));
      if (ex.length) ok(await sb.from('rsvps').delete().eq('event_id', eid).eq('user_id', me.id));
      else ok(await sb.from('rsvps').insert({ event_id: eid, user_id: me.id }));
    }
  };
}

const api = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase) ? makeSupabaseApi() : makeDemoApi();

/* =====================================================================
   畫面狀態與路由（#c--網址代稱--分頁）
   ===================================================================== */
const S = { user: null, communities: [], memberships: [], ui: {} };
const TABS = [['feed','社群'],['classroom','課程'],['calendar','行事曆'],['members','成員'],['leaderboard','排行榜'],['about','關於']];
function parseRoute() {
  const h = location.hash.replace(/^#/, '');
  if (h === 'new') return { view: 'new' };
  if (h.startsWith('c--')) { const [, slug, tab] = h.split('--'); return { view: 'community', slug, tab: tab || 'feed' }; }
  return { view: 'home' };
}
const go = h => { if (location.hash === '#' + h) render(); else location.hash = h; };
const memOf = cid => S.memberships.find(m => m.community_id === cid);
const activeMem = cid => memOf(cid)?.status === 'active' ? memOf(cid) : null;
const isRealAdmin = cid => ['owner','admin'].includes(activeMem(cid)?.role);
const isAdminOf = cid => !S.preview && isRealAdmin(cid);
const levelNames = c => (c.level_names && c.level_names.length === 9) ? c.level_names : DEFAULT_LEVEL_NAMES;

async function refreshBase() {
  S.user = await api.getUser();
  if (!S.user) return;
  [S.communities, S.memberships] = await Promise.all([api.listCommunities(), api.myMemberships()]);
}

async function render() {
  const app = document.getElementById('app');
  try {
    await refreshBase();
    renderTop();
    if (!S.user) { app.innerHTML = authView(); return; }
    const r = parseRoute();
    if (r.view === 'new') app.innerHTML = newCommunityView();
    else if (r.view === 'community') app.innerHTML = await communityView(r);
    else app.innerHTML = homeView();
    await renderModal();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button class="btn" data-act="home">回到首頁</button></div>`;
  }
}

function renderTop() {
  const r = parseRoute();
  const c = r.view === 'community' ? S.communities.find(x => x.slug === r.slug) : null;
  document.getElementById('topbar').innerHTML = `
    <a class="brand" href="#"><i>聚</i>${esc(CONFIG.APP_NAME)}</a>
    ${c ? `<span class="crumb">／ ${esc(c.name)}</span>` : ''}
    <span class="spacer"></span>
    ${api.mode === 'demo' ? `<span class="chip" title="資料只存在這台瀏覽器">示範模式</span><button class="btn ghost sm" data-act="reset">重設範例資料</button>` : ''}
    ${S.user ? `<span class="row small">${avatar(S.user, null, true)}<span class="name">${esc(S.user.name)}</span></span><button class="btn ghost sm" data-act="signout">登出</button>` : ''}`;
}

function communityCard(c) {
  const m = memOf(c.id);
  const status = m?.status === 'active' ? `<span class="tag">已加入 · 等級 ${levelFor(m.points)}</span>` : m?.status === 'pending' ? '<span class="tag">審核中</span>' : '';
  const i = Math.abs([...c.slug].reduce((s, ch) => s + ch.charCodeAt(0), 0)) % COVER_BG.length;
  return `<a class="card ccard" href="#c--${esc(c.slug)}--${m?.status === 'active' ? 'feed' : 'about'}">
    <div class="cover" style="background:${COVER_BG[i]}">${esc(c.name.charAt(0))}</div>
    <h3>${esc(c.name)}</h3>
    <p class="muted small" style="margin:0">${esc(c.tagline || '')}</p>
    <div class="row meta">${c.is_private ? '私密' : '公開'} · ${c.member_count} 位成員 · ${c.price_monthly ? `每月 NT$${c.price_monthly}` : '免費'} ${status}</div>
  </a>`;

  const q = (S.ui.q || '').trim().toLowerCase();

    <div class="hero" style="margin-top:36px"><h2 style="margin:0;font-size:22px">探索社群</h2>

/* ---------- 社群內頁 ---------- */
async function communityView(r) {
  const c = S.communities.find(x => x.slug === r.slug);
  if (!c) return `<div class="card empty">找不到這個社群。<br><br><a class="btn" href="#">回到首頁</a></div>`;
  const m = activeMem(c.id);
  const tab = m ? r.tab : 'about';
  const tabs = `<nav class="tabs" aria-label="社群分頁">${TABS.map(([k, label]) =>
    `<a href="#c--${esc(c.slug)}--${k}" class="${!m && k !== 'about' ? 'off' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${label}</a>`).join('')}</nav>`;
  const head = `<div class="chead"><div><h1>${esc(c.name)}</h1><p>${esc(c.tagline || '')}</p></div>
    ${isRealAdmin(c.id) ? `<button class="btn sm ${S.preview ? 'primary' : ''}" data-act="preview" aria-pressed="${!!S.preview}">${S.preview ? '結束成員視角' : '以成員視角預覽'}</button>` : ''}</div>`;
  let body = '';
  if (tab === 'feed') body = await feedView(c, m);
  else if (tab === 'classroom') body = await classroomView(c, m);
  else if (tab === 'calendar') body = await calendarView(c, m);
  else if (tab === 'members') body = await membersView(c, m);
  else if (tab === 'leaderboard') body = await leaderboardView(c, m);
  else body = aboutView(c, m);
  return head + tabs + body;
}

function sideCard(c, m, top) {

      <div class="prog" style="margin:12px 0 6px" role="progressbar" aria-valuenow="${lp.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${lp.pct}%"></span></div>
      <div class="small muted">${lp.level >= 9 ? '已達最高等級' : `再 ${lp.need} 分升到等級 ${lp.level+1}`} · 目前 ${m.points} 分</div>
    </div>
    <div class="card lb"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>30 天排行</h3><a class="small" href="#c--${esc(c.slug)}--leaderboard">全部</a></div>
      ${top.length ? `<ol>${top.slice(0, 5).map((r, i) => `<li><span class="rank ${i < 3 ? 'top' : ''}">${i+1}</span>${avatar({ id: r.user_id, name: r.name }, r.total_points, true)}<span class="name">${esc(r.name)}</span><span class="pts">+${r.points}</span></li>`).join('')}</ol>` : '<p class="muted small">還沒有分數</p>'}
    </div>
    <div class="card small"><b>${esc(c.name)}</b><p class="muted" style="margin:4px 0 8px">${esc(c.tagline || '')}</p><span class="muted">${c.member_count} 位成員 · ${c.is_private ? '私密' : '公開'}</span></div>

async function feedView(c, m) {
  const [posts, cats, top, members] = await Promise.all([api.listPosts(c.id), api.listCategories(c.id), api.leaderboard(c.id, 30), api.listMembers(c.id)]);
  const pts = Object.fromEntries(members.map(x => [x.user_id, x.points]));
  const f = S.ui.cat || 'all';
  const shown = posts.filter(p => f === 'all' || p.category_id === f);
  const catName = id => cats.find(x => x.id === id)?.name || '';
  const admin = isAdminOf(c.id);
  const composer = S.ui.composing
    ? `<form class="card f" data-form="post" data-cid="${c.id}">
        <input id="np-title" name="title" required maxlength="200" placeholder="標題">
        <textarea id="np-body" name="body" placeholder="想分享什麼？"></textarea>
        <div class="row"><select id="np-cat" name="category_id" style="flex:1 1 160px" aria-label="分類">${cats.filter(x => admin || !x.admin_only).map(x => `<option value="${x.id}" ${x.name === '一般討論' ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        <button type="button" class="btn ghost" data-act="compose-off">取消</button><button class="btn primary">發布</button></div>
        <div id="form-err"></div></form>`
    : `<button class="composer-btn" data-act="compose">${avatar(S.user, m.points, true)}寫點什麼…</button>`;
  const list = shown.length ? shown.map(p => `
    <article class="card post" data-act="open-post" data-id="${p.id}" tabindex="0">
      <div class="row">${avatar(p.author, pts[p.author.id] ?? 0)}<div><b>${esc(p.author.name)}</b><div class="meta">${ago(p.created_at)} · <span class="tag">${esc(catName(p.category_id))}</span> ${p.pinned ? '<span class="pin">置頂</span>' : ''}</div></div></div>
      <h3>${esc(p.title)}</h3><p class="ex">${esc(p.body)}</p>
      <div class="acts"><button class="like ${p.liked ? 'on' : ''}" data-act="like" data-type="post" data-id="${p.id}" aria-pressed="${p.liked}" aria-label="按讚">${heart}${p.like_count}</button>
      <span class="like" aria-hidden="true">💬 ${p.comment_count}</span></div>
    </article>`).join('') : `<div class="card empty">這個分類還沒有貼文，當第一個發文的人吧。</div>`;
  return `<div class="grid2"><section class="stack">${composer}
    <div class="filters" role="group" aria-label="分類篩選"><button data-act="cat" data-id="all" aria-pressed="${f === 'all'}">全部</button>${cats.map(x => `<button data-act="cat" data-id="${x.id}" aria-pressed="${f === x.id}">${esc(x.name)}</button>`).join('')}</div>
    ${list}</section>${sideCard(c, m, top)}</div>`;
}

/* ---------- 貼文詳情（彈窗） ---------- */
async function renderModal() {
  const root = document.getElementById('modal-root');
  const id = S.ui.post;
  if (!id) { root.innerHTML = ''; return; }
  const r = parseRoute(); const c = S.communities.find(x => x.slug === r.slug);
  if (!c) { S.ui.post = null; root.innerHTML = ''; return; }
  const [posts, comments, members, cats] = await Promise.all([api.listPosts(c.id), api.listComments(id), api.listMembers(c.id), api.listCategories(c.id)]);
  const p = posts.find(x => x.id === id);
  if (!p) { S.ui.post = null; root.innerHTML = ''; return; }
  const pts = Object.fromEntries(members.map(x => [x.user_id, x.points]));
  const admin = isAdminOf(c.id), mine = p.author.id === S.user.id;
  const cmt = x => `<div class="cmt ${x.parent_id ? 'reply' : ''}">${avatar(x.author, pts[x.author.id] ?? 0, true)}<div style="min-width:0"><div class="bubble"><b class="small">${esc(x.author.name)}</b><p>${esc(x.body)}</p></div>
    <div class="row small" style="gap:2px;margin-top:2px"><button class="like ${x.liked ? 'on' : ''}" data-act="like" data-type="comment" data-id="${x.id}" aria-pressed="${x.liked}" aria-label="按讚">${heart}${x.like_count}</button>
    ${x.parent_id ? '' : `<button class="btn ghost sm" data-act="reply" data-id="${x.id}">回覆</button>`}<span class="muted">${ago(x.created_at)}</span></div>
    ${S.ui.replyTo === x.id ? `<form class="f" data-form="comment" data-post="${p.id}" data-cid="${c.id}" data-parent="${x.id}" style="margin-top:6px"><textarea id="reply-body" name="body" required style="min-height:70px" placeholder="回覆 ${esc(x.author.name)}"></textarea><div class="row"><button class="btn primary sm">送出回覆</button></div></form>` : ''}</div></div>`;
  const tops = comments.filter(x => !x.parent_id);
  root.innerHTML = `<div class="overlay" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(p.title)}" data-stop>
    <button class="btn ghost sm x" data-act="close-modal" aria-label="關閉">✕</button>
    <div class="row">${avatar(p.author, pts[p.author.id] ?? 0)}<div><b>${esc(p.author.name)}</b><div class="meta">${ago(p.created_at)} · ${esc(cats.find(x => x.id === p.category_id)?.name || '')}</div></div></div>
    <h2>${esc(p.title)}</h2><p class="post-body">${esc(p.body)}</p>
    <div class="row"><button class="like ${p.liked ? 'on' : ''}" data-act="like" data-type="post" data-id="${p.id}" aria-pressed="${p.liked}" aria-label="按讚">${heart}${p.like_count}</button>
      <span class="spacer"></span>${admin ? `<button class="btn ghost sm" data-act="pin" data-id="${p.id}">${p.pinned ? '取消置頂' : '置頂'}</button>` : ''}
      ${admin || mine ? `<button class="btn ghost sm danger" data-act="del-post" data-id="${p.id}">${S.ui.confirmDel === p.id ? '確定刪除？' : '刪除'}</button>` : ''}</div>
    <div class="cmts">${tops.map(t => cmt(t) + comments.filter(x => x.parent_id === t.id).map(cmt).join('')).join('') || '<p class="muted small" style="margin:0">還沒有留言</p>'}
      <form class="f" data-form="comment" data-post="${p.id}" data-cid="${c.id}"><textarea id="cm-body" name="body" required style="min-height:70px" placeholder="留言…"></textarea><div class="row"><button class="btn primary sm">留言</button></div></form>
    </div></div></div>`;
}

/* ---------- 課程 ---------- */
function courseAccess(c, course, m, module) {
  if (isAdminOf(c.id)) return { ok: true };
  const lv = levelFor(m.points);
  if (lv < course.unlock_level) return { ok: false, why: `等級 ${course.unlock_level}「${levelNames(c)[course.unlock_level-1]}」解鎖` };
  if (module && module.drip_days) {
    const openAt = new Date(m.joined_at).getTime() + module.drip_days * 86400000;
    if (Date.now() < openAt) return { ok: false, why: `入會第 ${module.drip_days} 天開放（${new Date(openAt).toLocaleDateString('zh-TW')}）` };
  }
  return { ok: true };
}
async function classroomView(c, m) {
  const [courses, done] = await Promise.all([api.listCourses(c.id), api.listProgress()]);
  const doneSet = new Set(done), admin = isAdminOf(c.id);
  const open = courses.find(k => k.id === S.ui.course);
  if (!open) {
    const cards = courses.map((k, i) => {
      const acc = courseAccess(c, k, m); const all = k.modules.flatMap(x => x.lessons);
      const pct = all.length ? Math.round(all.filter(l => doneSet.has(l.id)).length / all.length * 100) : 0;
      return `<button class="card ccard" style="text-align:left;cursor:${acc.ok ? 'pointer' : 'default'}" ${acc.ok ? `data-act="open-course" data-id="${k.id}"` : 'aria-disabled="true"'}>
        <div class="cover" style="background:${COVER_BG[i % COVER_BG.length]}">${esc(k.title.charAt(0))}${acc.ok ? '' : `<div class="lock">🔒 ${esc(acc.why)}</div>`}</div>
        <h3>${esc(k.title)}${k.published ? '' : ' <span class="tag">草稿</span>'}</h3><p class="muted small" style="margin:0">${esc(k.description || '')}</p>
        ${acc.ok ? `<div class="prog" aria-label="完成度 ${pct}%"><span style="width:${pct}%"></span></div><span class="small muted">完成 ${pct}%</span>` : ''}
      </button>`;
    }).join('');
    return `${courses.length ? `<div class="cgrid">${cards}</div>` : `<div class="card empty">還沒有課程${admin ? '，用下面的表單新增第一堂。' : '。'}</div>`}
      ${admin ? `<details class="admin-box" style="margin-top:18px"><summary>＋ 新增課程（管理員）</summary>
        <form class="f" data-form="course" data-cid="${c.id}"><label>課程名稱<input id="nk-title" name="title" required></label>
        <label>說明<input id="nk-desc" name="description"></label>
        <label>解鎖等級<select id="nk-lv" name="unlock_level">${levelNames(c).map((n, i) => `<option value="${i+1}">等級 ${i+1}・${esc(n)}</option>`).join('')}</select></label>
        <div id="form-err"></div><button class="btn primary">新增課程</button></form></details>` : ''}`;
  }
  const lessonsFlat = open.modules.flatMap(md => md.lessons.map(l => ({ ...l, module: md })));
  const curId = S.ui.lesson && lessonsFlat.some(l => l.id === S.ui.lesson) ? S.ui.lesson : lessonsFlat.find(l => courseAccess(c, open, m, l.module).ok)?.id;
  const lesson = curId ? await api.getLesson(curId) : null;
  const curMod = lessonsFlat.find(l => l.id === curId)?.module;
  const acc = curMod ? courseAccess(c, open, m, curMod) : { ok: true };
  const isUrl = u => /^https?:\/\//.test(u || '');
  const video = lesson && isUrl(lesson.video_url)
    ? (api.mode === 'supabase' && /youtube\.com\/watch\?v=|youtu\.be\//.test(lesson.video_url)
        ? `<iframe class="vframe" src="https://www.youtube.com/embed/${esc((lesson.video_url.match(/(?:v=|youtu\.be\/)([\w-]{6,})/) || [])[1] || '')}" allowfullscreen title="課程影片"></iframe>`
        : `<div class="video">▶<div><b>課程影片</b><div class="small"><a href="${esc(lesson.video_url)}" target="_blank" rel="noopener">${esc(lesson.video_url)}</a></div></div></div>`)
    : '';
  return `<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" data-act="close-course">← 所有課程</button><h2 style="margin:0">${esc(open.title)}</h2></div>
    <div class="course-layout"><aside class="card">
      ${open.modules.map(md => { const a = courseAccess(c, open, m, md); return `<div class="mod"><h4>${esc(md.title)}${a.ok ? '' : ` 🔒`}</h4>
        ${a.ok ? md.lessons.map(l => `<button class="lesson-link" data-act="open-lesson" data-id="${l.id}" aria-current="${l.id === curId}"><span class="dot ${doneSet.has(l.id) ? 'done' : ''}"></span>${esc(l.title)}</button>`).join('') || '<p class="small muted" style="margin:0 8px">尚無單元</p>'
          : `<p class="small muted" style="margin:0 8px">${esc(a.why)}</p>`}</div>`; }).join('') || '<p class="muted small">還沒有章節</p>'}
      ${admin ? `<details class="admin-box"><summary>＋ 新增章節</summary><form class="f" data-form="module" data-course="${open.id}">
        <input id="nm-title" name="title" required placeholder="章節名稱"><label>入會滿幾天才開放（0 = 立即）<input id="nm-drip" name="drip_days" type="number" min="0" value="0"></label><button class="btn primary sm">新增</button></form></details>` : ''}
    </aside>
    <section class="card">${lesson && acc.ok ? `<h2 style="font-size:20px">${esc(lesson.title)}</h2>${video}<div class="lesson-body">${esc(lesson.body || '')}</div>
      <div class="row" style="margin-top:18px"><button class="btn ${doneSet.has(lesson.id) ? '' : 'primary'}" data-act="complete" data-id="${lesson.id}">${doneSet.has(lesson.id) ? '✓ 已完成（點擊取消）' : '標記為完成'}</button></div>`
      : `<div class="empty">${lessonsFlat.length ? '選一個單元開始' : '這門課還沒有單元'}</div>`}
      ${admin && open.modules.length ? `<details class="admin-box" style="margin-top:18px"><summary>＋ 新增單元</summary><form class="f" data-form="lesson" data-cid="${c.id}" data-course="${open.id}">
        <label>章節<select id="nl-mod" name="module_id">${open.modules.map(md => `<option value="${md.id}">${esc(md.title)}</option>`).join('')}</select></label>
        <label>單元名稱<input id="nl-title" name="title" required></label><label>影片網址（選填）<input id="nl-video" name="video_url" type="url" placeholder="https://"></label>
        <label>內容<textarea id="nl-body" name="body"></textarea></label><div id="form-err"></div><button class="btn primary sm">新增單元</button></form></details>` : ''}
    </section></div>`;
}

/* ---------- 行事曆 ---------- */
async function calendarView(c, m) {
  const events = await api.listEvents(c.id), admin = isAdminOf(c.id);
  const now = Date.now();
  const upcoming = events.filter(e => new Date(e.starts_at).getTime() + e.duration_min * 60000 >= now);
  const past = events.filter(e => !upcoming.includes(e)).reverse();
  const wd = ['日','一','二','三','四','五','六'];
  const ev = e => { const d = new Date(e.starts_at), end = new Date(d.getTime() + e.duration_min * 60000);
    const t = x => x.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `<div class="card ev"><div class="date"><span>${d.getMonth()+1} 月</span><b>${d.getDate()}</b><span>週${wd[d.getDay()]}</span></div>
      <div style="min-width:0"><h3>${esc(e.title)}</h3><div class="meta">${t(d)}–${t(end)} · ${e.going_count} 人參加</div>
      ${e.description ? `<p style="margin:6px 0 0;white-space:pre-wrap">${esc(e.description)}</p>` : ''}
      ${e.location_url ? `<div class="small" style="margin-top:4px">連結：<a href="${esc(e.location_url)}" target="_blank" rel="noopener">${esc(e.location_url)}</a></div>` : ''}</div>
      <div class="ev-act">${new Date(e.starts_at).getTime() > now ? `<button class="btn ${e.going ? '' : 'primary'} sm" data-act="rsvp" data-id="${e.id}">${e.going ? '✓ 已報名' : '我要參加'}</button>` : ''}</div></div>`; };
  return `<div class="stack"><h2>即將舉行</h2>${upcoming.map(ev).join('') || '<div class="card empty">目前沒有排定的活動</div>'}
    ${admin ? `<details class="admin-box"><summary>＋ 新增活動（管理員）</summary><form class="f" data-form="event" data-cid="${c.id}">
      <label>活動名稱<input id="ne-title" name="title" required></label>
      <div class="inline"><label>開始時間<input id="ne-start" name="starts_at" type="datetime-local" required></label><label>長度（分鐘）<input id="ne-dur" name="duration_min" type="number" min="15" step="15" value="60"></label></div>
      <label>線上會議連結（選填）<input id="ne-url" name="location_url" type="url" placeholder="https://"></label>
      <label>說明<textarea id="ne-desc" name="description"></textarea></label><div id="form-err"></div><button class="btn primary">新增活動</button></form></details>` : ''}
    ${past.length ? `<h2 style="margin-top:14px">過去的活動</h2>${past.map(ev).join('')}` : ''}</div>`;
}

/* ---------- 成員 ---------- */
async function membersView(c, m) {
  const all = await api.listMembers(c.id), admin = isAdminOf(c.id), names = levelNames(c);
  const pending = all.filter(x => x.status === 'pending'), active = all.filter(x => x.status === 'active').sort((a, b) => b.points - a.points);
  const role = r => ({ owner: '擁有者', admin: '管理員', member: '成員' }[r]);
  return `<div class="stack">
    ${admin && pending.length ? `<div class="card"><h2>待審核（${pending.length}）</h2>${pending.map(x => `<div class="row" style="padding:6px 0">${avatar({ id: x.user_id, name: x.name }, null)}<b class="name" style="flex:1">${esc(x.name)}</b><span class="small muted">${ago(x.joined_at)}申請</span>
      <button class="btn primary sm" data-act="member" data-uid="${x.user_id}" data-cid="${c.id}" data-status="active">核准</button><button class="btn sm" data-act="member" data-uid="${x.user_id}" data-cid="${c.id}" data-status="removed">拒絕</button></div>`).join('')}</div>` : ''}
    <div class="card"><h2>成員（${active.length}）</h2>${active.map(x => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">${avatar({ id: x.user_id, name: x.name }, x.points)}
      <div style="flex:1;min-width:0"><b class="name">${esc(x.name)}</b><div class="small muted">${role(x.role)} · 等級 ${levelFor(x.points)}「${esc(names[levelFor(x.points)-1])}」 · ${x.points} 分 · ${new Date(x.joined_at).toLocaleDateString('zh-TW')} 加入</div></div>
      ${admin && x.role === 'member' ? `<button class="btn ghost sm danger" data-act="member" data-uid="${x.user_id}" data-cid="${c.id}" data-status="removed">移除</button>` : ''}</div>`).join('')}</div></div>`;
}

/* ---------- 排行榜＋等級表 ---------- */
async function leaderboardView(c, m) {
  const range = S.ui.range ?? 30;
  const [rows, members, courses] = await Promise.all([api.leaderboard(c.id, range || null), api.listMembers(c.id), api.listCourses(c.id)]);
  const names = levelNames(c), active = members.filter(x => x.status === 'active'), myLv = levelFor(m.points);
  const counts = Array(9).fill(0); active.forEach(x => counts[levelFor(x.points)-1]++);
  return `<div class="grid2"><section class="card lb">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">排行榜</h2>
      <div class="seg" role="group" aria-label="期間">${[[7,'7 天'],[30,'30 天'],[0,'全期']].map(([d, l]) => `<button data-act="range" data-d="${d}" aria-pressed="${range === d}">${l}</button>`).join('')}</div></div>
      ${rows.length ? `<ol>${rows.map((r, i) => `<li><span class="rank ${i < 3 ? 'top' : ''}">${i+1}</span>${avatar({ id: r.user_id, name: r.name }, r.total_points, true)}<span class="name">${esc(r.name)}${r.user_id === S.user.id ? '（你）' : ''}</span><span class="pts">${range ? '+' : ''}${r.points}</span></li>`).join('')}</ol>` : '<p class="muted">還沒有分數</p>'}
      <p class="small muted" style="margin:12px 0 0">別人幫你的貼文或留言按一個讚 = 1 分。</p>
    </section>
    <aside class="card"><h2>等級與解鎖</h2><div class="scroll"><table class="ladder"><thead><tr><th>等級</th><th>分數</th><th>人數</th></tr></thead><tbody>
      ${names.map((n, i) => { const unlocks = courses.filter(k => k.unlock_level === i+1).map(k => k.title);
        return `<tr class="${myLv === i+1 ? 'me' : ''}"><td><b>${i+1}・${esc(n)}</b>${unlocks.length ? `<div class="small muted">解鎖：${unlocks.map(esc).join('、')}</div>` : ''}</td><td class="num">${LEVEL_PTS[i].toLocaleString()}</td><td class="num">${counts[i]}</td></tr>`; }).join('')}
    </tbody></table></div></aside></div>`;
}

/* ---------- 關於 / 加入 ---------- */
function aboutView(c, m) {
  const mm = memOf(c.id);
  const cta = m ? (m.role === 'owner' ? '<span class="tag">你是這個社群的擁有者</span>' : `<button class="btn" data-act="leave" data-cid="${c.id}">${S.ui.confirmLeave ? '確定退出？' : '退出社群'}</button>`)
    : mm?.status === 'pending' ? '<span class="tag">已送出申請，等待版主審核</span>'
    : `<button class="btn primary" data-act="join" data-cid="${c.id}">${c.is_private ? '申請加入' : '加入社群'}${c.price_monthly ? `（每月 NT$${c.price_monthly}）` : '（免費）'}</button>`;
  return `<div class="grid2"><section class="card"><h2>關於這個社群</h2><p style="white-space:pre-wrap;margin-top:0">${esc(c.description || '版主還沒有寫介紹。')}</p><div class="row" style="margin-top:16px">${cta}</div></section>
    <aside class="card"><dl class="kv"><dt>成員</dt><dd>${c.member_count} 位</dd><dt>類型</dt><dd>${c.is_private ? '私密（需審核）' : '公開'}</dd><dt>費用</dt><dd>${c.price_monthly ? `每月 NT$${c.price_monthly}` : '免費'}</dd><dt>建立</dt><dd>${new Date(c.created_at).toLocaleDateString('zh-TW')}</dd></dl></aside></div>`;
}

/* =====================================================================
   事件處理
   ===================================================================== */
async function act(fn, msg) {
  try { await fn(); if (msg) toast(msg); await render(); }
  catch (e) { toast(e.message); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'close-modal' && e.target.closest('[data-stop]') && !e.target.closest('.x')) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  if (a !== 'like' && a !== 'open-post') e.stopPropagation();
  switch (a) {
    case 'home': return go('');
    case 'signout': return act(() => api.signOut());
    case 'reset': if (S.ui.confirmReset) { S.ui = {}; return act(() => api.reset(), '已重設範例資料'); } S.ui.confirmReset = true; el.textContent = '確定重設？'; setTimeout(() => { S.ui.confirmReset = false; renderTop(); }, 3000); return;
    case 'authmode': S.ui.authMode = S.ui.authMode === 'up' ? 'in' : 'up'; return render();
    case 'compose': S.ui.composing = true; return render().then(() => document.getElementById('np-title')?.focus());
    case 'compose-off': S.ui.composing = false; return render();
    case 'cat': S.ui.cat = id; return render();
    case 'open-post': if (e.target.closest('[data-act="like"]')) return; S.ui.post = id; S.ui.replyTo = null; S.ui.confirmDel = null; return renderModal();
    case 'close-modal': S.ui.post = null; return render();
    case 'like': e.stopPropagation(); return act(() => api.toggleLike(el.dataset.type, id));
    case 'reply': S.ui.replyTo = S.ui.replyTo === id ? null : id; return renderModal().then(() => document.getElementById('reply-body')?.focus());
    case 'pin': return act(() => api.togglePin(id));
    case 'del-post': if (S.ui.confirmDel !== id) { S.ui.confirmDel = id; return renderModal(); } S.ui.post = null; S.ui.confirmDel = null; return act(() => api.deletePost(id), '已刪除貼文');
    case 'open-course': S.ui.course = id; S.ui.lesson = null; return render();
    case 'close-course': S.ui.course = null; return render();
    case 'open-lesson': S.ui.lesson = id; return render();
    case 'complete': return act(() => api.toggleComplete(id));
    case 'rsvp': return act(() => api.toggleRsvp(id));
    case 'preview': S.preview = !S.preview; S.ui.course = null; return render().then(() => toast(S.preview ? '現在看到的是一般成員的畫面' : '已回到管理員畫面'));
    case 'range': S.ui.range = Number(el.dataset.d); return render();
    case 'member': return act(() => api.setMemberStatus(el.dataset.cid, el.dataset.uid, el.dataset.status), el.dataset.status === 'active' ? '已核准' : '已移除');
    case 'join': return act(async () => { const st = await api.join(el.dataset.cid); if (st === 'active') { const c = S.communities.find(x => x.id === el.dataset.cid); location.hash = `c--${c.slug}--feed`; } }, '已送出');
    case 'leave': if (!S.ui.confirmLeave) { S.ui.confirmLeave = true; return render(); } S.ui.confirmLeave = false; return act(() => api.leave(el.dataset.cid), '已退出社群');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.ui.post) { S.ui.post = null; render(); }
  if (e.key === 'Enter' && e.target.matches('article.post')) { S.ui.post = e.target.dataset.id; renderModal(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') {
    S.ui.q = e.target.value; const pos = e.target.selectionStart;
    document.getElementById('app').innerHTML = homeView();
    const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos);
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), kind = f.dataset.form;
  const errBox = f.querySelector('#form-err');
  const btn = f.querySelector('button:not([type="button"])'); if (btn) btn.disabled = true;
  try {
    if (kind === 'auth') { if (S.ui.authMode === 'up') await api.signUp(d.email, d.password, d.name); else await api.signIn(d.email, d.password); S.ui = {}; }
    if (kind === 'community') {
      const c = await api.createCommunity({ name: d.name.trim(), slug: d.slug.trim().toLowerCase(), tagline: d.tagline.trim(), description: d.description.trim(), is_private: !!d.is_private });
      S.ui = {}; location.hash = `c--${c.slug}--feed`; toast('社群建立好了'); return;
    }
    if (kind === 'post') { await api.createPost({ community_id: f.dataset.cid, title: d.title.trim(), body: d.body.trim(), category_id: d.category_id }); S.ui.composing = false; toast('已發布'); }
    if (kind === 'comment') { await api.createComment({ post_id: f.dataset.post, community_id: f.dataset.cid, parent_id: f.dataset.parent || null, body: d.body.trim() }); S.ui.replyTo = null; }
    if (kind === 'course') { const k = await api.createCourse({ community_id: f.dataset.cid, title: d.title.trim(), description: d.description.trim(), unlock_level: Number(d.unlock_level) }); S.ui.course = k.id; toast('已新增課程'); }
    if (kind === 'module') { await api.createModule({ course_id: f.dataset.course, title: d.title.trim(), drip_days: Number(d.drip_days) || 0 }); toast('已新增章節'); }
    if (kind === 'lesson') { const l = await api.createLesson({ community_id: f.dataset.cid, course_id: f.dataset.course, module_id: d.module_id, title: d.title.trim(), video_url: d.video_url.trim(), body: d.body }); S.ui.lesson = l?.id || null; toast('已新增單元'); }
    if (kind === 'event') { await api.createEvent({ community_id: f.dataset.cid, title: d.title.trim(), description: d.description.trim(), starts_at: new Date(d.starts_at).toISOString(), duration_min: Number(d.duration_min) || 60, location_url: d.location_url.trim() }); toast('已新增活動'); }
    await render();
  } catch (err) {
    if (errBox) errBox.innerHTML = `<p class="err">${esc(err.message)}</p>`; else toast(err.message);
    if (btn) btn.disabled = false;
  }
});
window.addEventListener('hashchange', () => { S.ui = { authMode: S.ui.authMode }; render(); });
render();
</script>
